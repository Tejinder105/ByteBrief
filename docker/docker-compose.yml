services:
  postgres:
    image: postgres:17
    container_name: bytebrief-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bytebrief}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bytebrief}
      POSTGRES_DB: ${POSTGRES_DB:-bytebrief}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bytebrief_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bytebrief} -d ${POSTGRES_DB:-bytebrief}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bytebrief_postgres_data:
